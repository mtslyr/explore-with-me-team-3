server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:6541/ewm-service
    username: ewm
    password: ewm
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true
  sql:
    init:
      mode: always

logging:
  level:
    root: info
    ru.practicum.ewm: debug
    org.zalando.logbook: trace